<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="inscription.css">
    <link rel="stylesheet" href="../globalSettings/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>inscription</title>
</head>
<body>
    <header>
        <div class="logo" id ="logo">
            <img src="/frontend/assets/pictures/Logo.png" alt="logo TalentHub">
            <h1>TalentHub</h1>
        </div>
        <div class="nav_bar" onclick="myFunction()">
            <nav class="navig">
                <li>
                    <ul><a href="../acceuil/index.html" target="_self">acceuil</a></ul>
                    <ul><a href="#" onclick="getConnexionPage()">connexion</a></ul>
                    <ul><a href="#">aide</a></ul>
                </li>
            </nav>
            <div class="first_bar"></div>
            <div class="second_bar"></div>
        </div>
    </header>


    <div class="connexion_page">
        <form action="http://localhost:8000/api/token/" method="POST" id ="login_form">
            <label for="identifiant">email:</label>
            <input type="email" name="email" id="email" required>
            <label for="mot_passe">Mot de passe</label>
            <input type="password" name="mot_passe" id="mot_passe" required>
            <input type="submit" value="Envoyer" >
        </form>
    </div>



    <main>
        <section>
            <div class="informations">
                <h2>Créer un Compte</h2>
                <form action="http://localhost:8000/apiUser/user/" method="POST" id="register_form">
                    <label for="nom">Nom: </label>
                    <input type="text" name="nom" id="nom">
                    <label for="nom">Prenom: </label>
                    <input type="text" name="prenom" id="prenom">
                    <label for="mail"> adresse email</label>
                    <input type="email" name="mail" id="email" required>
                    <label for="phone"> Tel:</label>
                    <input type="tel" name="phone" id="phone" required>
                    <label for="mot_passe">mot de passe: </label>
                    <input type="password" name="mot_passe" id="mot_passe_register" required>
                    <input type="submit" value="s'inscrire">
                </form>
                <div class="policy">
                    <a href="#">termes du service</a>
                    <a href="#"> police de confidentialité</a>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>©️2026 TalentHub Tous droits reservés</p>
        <nav>
            <a href="#">contactez-nous</a>
            <a href="#">à propos de nous</a>
            <a href="#">support</a>
        </nav>
    </footer>
    <script src="scriptInscription.js" defer type="module"></script>
    <script src="../api/userApi.js" type="module" ></script>
    <script src="../api/config.js" type="module" ></script>
    <script src="../globalSettings/main.js" type="module"></script>
</body>
</html>
